<!-- miolo recriado no estilo da capa (carrossel5): o post real só tem capa e aviso -->
<!doctype html><meta charset="utf-8">{{FONTES}}
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{position:relative;width:1080px;height:1350px;overflow:hidden;background:#9e171c;font-family:"Inter",sans-serif;color:#fff}
/* textura de tecido: faixas diagonais suaves de luz e sombra */
.tecido{position:absolute;inset:0;background:
 radial-gradient(ellipse 70% 30% at 20% 62%,rgba(255,70,70,.16),transparent 70%),
 radial-gradient(ellipse 60% 26% at 85% 90%,rgba(255,60,60,.17),transparent 70%),
 radial-gradient(ellipse 40% 60% at 5% 35%,rgba(70,0,5,.30),transparent 70%),
 radial-gradient(ellipse 50% 40% at 95% 20%,rgba(255,80,80,.10),transparent 70%),
 linear-gradient(168deg,rgba(0,0,0,0) 0%,rgba(60,0,5,.22) 22%,rgba(0,0,0,0) 34%,rgba(255,60,60,.10) 52%,rgba(60,0,5,.20) 66%,rgba(0,0,0,0) 78%,rgba(255,60,60,.12) 90%),
 linear-gradient(180deg,#a11a1f,#9b161b 50%,#a31b20)}
.moldura{position:absolute;left:100px;top:186px;width:879px;height:957px;border:1.5px solid rgba(255,255,255,.28);border-radius:84px}
/* moedas decorativas em CSS (a ilustração 3D do original é de terceiros e não é reproduzida) */
.moeda{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 38% 35%,#ffe56a 0%,#f6bf1c 45%,#d99100 100%);box-shadow:inset -8px -6px 0 rgba(160,90,0,.55),0 8px 16px rgba(0,0,0,.25)}
.moeda::after{content:"";position:absolute;inset:14%;border-radius:50%;border:3px solid rgba(160,90,0,.28)}
.sobre{position:absolute;left:0;right:0;top:259px;text-align:center;font-weight:400;font-size:30px;letter-spacing:.2em;line-height:36px;text-transform:uppercase;padding-left:.2em;white-space:nowrap;opacity:.85}
/* bloco de texto: título, corpo e frase de fecho; o script encolhe a letra de 2 em 2 px até caber */
.texto{position:absolute;left:150px;right:150px;top:330px;height:770px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:44px}
.titulo{font-weight:700;font-size:1.75em;line-height:1;letter-spacing:-.03em;text-transform:uppercase;text-wrap:balance}
.corpo{margin:.9em 0 0;font-weight:400;font-size:1em;line-height:1.3;letter-spacing:-.005em;text-wrap:pretty}
.destaque{align-self:center;margin:1em 0 0;padding:.45em .9em;border-radius:20px;background:#138a3b;font-weight:600;font-size:.9em;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.rodape{position:absolute;left:106px;top:1270px;font-family:"Poppins",sans-serif;font-weight:700;font-size:25.5px;letter-spacing:.01em;line-height:28px;text-transform:uppercase;white-space:nowrap}
.logo{position:absolute;right:104px;top:1264px;height:40px;display:flex;align-items:center;gap:10px;font-weight:400;font-size:27px;letter-spacing:.22em;line-height:40px;white-space:nowrap}
.logo i{font-style:normal;font-weight:300;font-size:56px;line-height:40px;color:#ff7d80;transform:scaleX(.5);margin:0 -2px}
</style>
<div class="tecido"></div>
<div class="moeda" style="left:-60px;top:110px;width:120px;height:140px;transform:rotate(-24deg)"></div>
<div class="moeda" style="left:990px;top:1010px;width:140px;height:96px;transform:rotate(14deg)"></div>
<div class="moldura"></div>
<div class="sobre" data-slot="sobretitulo">Análise do mercado</div>
<div class="texto" data-ajustar data-caixa="area">
<div class="titulo" data-slot="titulo">O que a Ata disse</div>
<p class="corpo" data-slot="corpo">O Comitê manteve a taxa e explicou os motivos. A inflação segue no centro da decisão.</p>
<p class="destaque" data-slot="destaque">Entenda o cenário antes de decidir.</p>
</div>
<div class="rodape" data-slot="rodape">Conteúdo informativo</div>
<div class="logo">SUNO<i>(</i>ASSET<i>)</i></div>
