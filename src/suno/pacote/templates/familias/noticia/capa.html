<!doctype html><meta charset="utf-8">{{FONTES}}
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:"Poppins",sans-serif;color:#fff;
  background:linear-gradient(155deg,#10151b 0%,#0a0e13 35%,#030405 75%,#000 100%)}
.bloco{position:absolute;left:103px;top:0;bottom:0;width:930px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-top:20px}
.logo{margin-left:15px;width:115px;height:115px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;

.logo .t{margin:0 3px 0 6px;transform:translateY(1px)}

.acao{margin:38px 0 0 16px;display:flex;align-items:center;gap:8px}
.chamada{height:78px;padding:0 42px;border-radius:39px;background:linear-gradient(180deg,#f50000 0%,#c70000 60%,#a80000 100%);

.seta{flex:none;position:relative;width:56px;height:56px;border-radius:50%;background:#3a3a3c;border:1.5px solid #5a1a1c;display:flex;align-items:center;justify-content:center}
.seta i{display:block;width:38px;height:38px;border-radius:50%;background:#e00000}
.seta svg{position:absolute;left:12px;top:12px}
