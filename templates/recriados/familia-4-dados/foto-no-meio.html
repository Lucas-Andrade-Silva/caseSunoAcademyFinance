<!doctype html><meta charset="utf-8">{{FONTES}}
<style>
*{box-sizing:border-box}

<h1 id="titulo" class="grad" data-slot="titulo">A regulamentação só passou a valer em <em>janeiro de 2025.</em></h1>

<p id="corpo" class="grad" data-slot="corpo">Naquele ano inteiro, <em>R$1 trilhão passou pelas casas de aposta regulamentadas no Brasil,</em> e R$40,7 bilhões ficaram com elas depois de pagar os prêmios.</p>
